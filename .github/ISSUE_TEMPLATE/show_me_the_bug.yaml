name: "🪲 报告一个问题"
description: 使用 LocalManus 时遇到异常，需要协助排查。
labels: bug
body:
  - type: markdown
    attributes:
      value: |
        本地小模型对提示词和上下文非常敏感，同一句任务在不同模型上表现可能完全不同。
        **环境信息填得越具体，越可能直接定位到根因。**
  - type: textarea
    id: bug-description
    attributes:
      label: 问题描述
      description: 你期望发生什么，实际发生了什么？
      placeholder: |
        期望：agent 打开 example.com 并写入文件
        实际：连续 6 次调用 go_to_url 后放弃，workspace 无产物
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 越短越好。能贴出任务原句（prompt）最有价值。
      placeholder: |
        1. python app.py
        2. 任务框输入：打开 example.com 用一句话总结这个页面
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: environment-information
    attributes:
      label: 环境信息
      value: |
        - 系统版本:（如 Windows 11 23H2 / macOS 14 / Ubuntu 22.04）
        - Python 版本:（如 3.13.7）
        - 模型与来源:（如 Ollama qwen3-8b-local:latest / DashScope qwen-max）
        - 模型是否支持 tool calling:
        - 启动方式:（python app.py / python main.py / python run_flow.py）
        - 运行模式:（本地优先 / 云端回落 / 纯文本浏览器模式）
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: |
        logs/ 下对应的日志文件最有帮助；页面类问题建议附界面截图。
        注意先删掉日志里的 API Key 和本地绝对路径。
      render: text
    validations:
      required: false
